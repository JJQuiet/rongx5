			var AndroidEventListenerFun = (state)=>{
			    var _event = null;
				if (state == 1 || state == "1")
				  _event = new Event('appHandUpOperation', { "bubbles": false, "cancelable": false });
				else
				  _event = new Event('appHandDownOperation', { "bubbles": false, "cancelable": false });
				document.dispatchEvent(_event);
	        }
			function fetchLocal(url) {
				return new Promise(function(resolve, reject) {
					console.log("url = " + url);
					var xhr = new XMLHttpRequest
					xhr.onload = function() {
						resolve(new Response(xhr.response, {
							status: xhr.status
						}))
					}
					xhr.onerror = function() {
						reject(new TypeError('Local request failed'))
					}
					xhr.open("GET", url)
					xhr.responseType = "arraybuffer";
					xhr.send(null)
				})
			};
			window.fetch = fetchLocal;
		</script>
